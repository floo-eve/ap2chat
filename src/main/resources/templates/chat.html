<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ap2-chat</title>
    <link rel="stylesheet" th:href="@{/css/chat.css}">
</head>
<body>
<main class="chat-app">
    <div class="app-header">
        <div>
            <h1>ap2-chat</h1>
            <p class="subtitle">Local LLM chat via Ollama + Spring AI</p>
        </div>
        <div class="header-actions">
            <span class="username" th:text="'Signed in as ' + ${username}"></span>
            <button id="clear-button" type="button" class="clear-button">Clear conversation</button>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="clear-button">Log out</button>
            </form>
        </div>
    </div>

    <details class="facts-panel">
        <summary>About you</summary>
        <div id="facts-list" class="facts-list"></div>
        <form id="facts-form" class="facts-form">
            <input id="fact-input" type="text" placeholder="Add a fact about yourself…" autocomplete="off" required>
            <button type="submit">Add</button>
        </form>
    </details>

    <div id="messages" class="messages">
        <div class="message assistant" th:text="'Hi ' + ${username} + ', how can I help you today?'"></div>
    </div>

    <form id="chat-form" class="chat-form">
        <input id="message-input" type="text" placeholder="Ask something…" autocomplete="off" required>
        <button type="submit">Send</button>
    </form>
</main>

<script th:inline="javascript">
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message-input');
    const messages = document.getElementById('messages');
    const clearButton = document.getElementById('clear-button');
    const greetingHtml = messages.innerHTML;
    const factsList = document.getElementById('facts-list');
    const factsForm = document.getElementById('facts-form');
    const factInput = document.getElementById('fact-input');

    function renderFact(fact) {
        const row = document.createElement('div');
        row.className = 'fact-item';

        const text = document.createElement('span');
        text.textContent = fact.fact;

        const removeButton = document.createElement('button');
        removeButton.type = 'button';
        removeButton.className = 'fact-remove';
        removeButton.textContent = '×';
        removeButton.addEventListener('click', async () => {
            removeButton.disabled = true;
            await fetch('/api/facts/' + fact.id, { method: 'DELETE' });
            row.remove();
        });

        row.appendChild(text);
        row.appendChild(removeButton);
        factsList.appendChild(row);
    }

    async function loadFacts() {
        const res = await fetch('/api/facts');
        const facts = await res.json();
        factsList.innerHTML = '';
        facts.forEach(renderFact);
    }

    factsForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const fact = factInput.value.trim();
        if (!fact) return;
        factInput.value = '';

        const res = await fetch('/api/facts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ fact })
        });
        renderFact(await res.json());
    });

    loadFacts();

    function addMessage(text, role) {
        const div = document.createElement('div');
        div.className = 'message ' + role;
        div.textContent = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        return div;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const userMessage = input.value.trim();
        if (!userMessage) return;

        addMessage(userMessage, 'user');
        input.value = '';
        input.disabled = true;

        const pending = addMessage('…', 'assistant pending');

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: userMessage })
            });
            if (!res.ok) throw new Error('Request failed: ' + res.status);
            const data = await res.json();
            pending.textContent = data.reply;
            pending.classList.remove('pending');
        } catch (err) {
            pending.textContent = 'Error: ' + err.message;
            pending.classList.add('error');
        } finally {
            input.disabled = false;
            input.focus();
        }
    });

    clearButton.addEventListener('click', async () => {
        clearButton.disabled = true;
        try {
            await fetch('/api/chat', { method: 'DELETE' });
            messages.innerHTML = greetingHtml;
        } finally {
            clearButton.disabled = false;
        }
    });
</script>
</body>
</html>
