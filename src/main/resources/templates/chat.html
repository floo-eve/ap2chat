<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ap2-chat</title>
    <link rel="stylesheet" th:href="@{/css/chat.css}">
</head>
<body>
<main class="chat-app">
    <div class="app-header">
        <div>
            <h1>ap2-chat</h1>
            <p class="subtitle">Local LLM chat via Ollama + Spring AI</p>
        </div>
        <button id="clear-button" type="button" class="clear-button">Clear conversation</button>
    </div>

    <div id="messages" class="messages"></div>

    <form id="chat-form" class="chat-form">
        <input id="message-input" type="text" placeholder="Ask something…" autocomplete="off" required>
        <button type="submit">Send</button>
    </form>
</main>

<script th:inline="javascript">
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message-input');
    const messages = document.getElementById('messages');
    const clearButton = document.getElementById('clear-button');

    let conversationId = localStorage.getItem('ap2chat-conversation-id');
    if (!conversationId) {
        conversationId = crypto.randomUUID();
        localStorage.setItem('ap2chat-conversation-id', conversationId);
    }

    function addMessage(text, role) {
        const div = document.createElement('div');
        div.className = 'message ' + role;
        div.textContent = text;
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
        return div;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const userMessage = input.value.trim();
        if (!userMessage) return;

        addMessage(userMessage, 'user');
        input.value = '';
        input.disabled = true;

        const pending = addMessage('…', 'assistant pending');

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Conversation-Id': conversationId
                },
                body: JSON.stringify({ message: userMessage })
            });
            if (!res.ok) throw new Error('Request failed: ' + res.status);
            const data = await res.json();
            pending.textContent = data.reply;
            pending.classList.remove('pending');
        } catch (err) {
            pending.textContent = 'Error: ' + err.message;
            pending.classList.add('error');
        } finally {
            input.disabled = false;
            input.focus();
        }
    });

    clearButton.addEventListener('click', async () => {
        clearButton.disabled = true;
        try {
            await fetch('/api/chat', {
                method: 'DELETE',
                headers: { 'X-Conversation-Id': conversationId }
            });
            messages.innerHTML = '';
        } finally {
            clearButton.disabled = false;
        }
    });
</script>
</body>
</html>
